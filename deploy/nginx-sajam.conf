# Uključuje se u server blok demo.kyuro.tech:  include snippets/sajam.conf;
# Osnovna autentikacija se nasljeđuje iz server bloka — /sajam/ je pod istom lozinkom kao demo.

# Jedina ruta bez lozinke: brain-monitor provjerava je svakih 5 minuta. Vraća samo {"ok":true}.
location = /sajam/api/zdravlje {
    auth_basic off;
    proxy_pass http://127.0.0.1:8020/api/zdravlje;
    add_header Cache-Control "no-store" always;
}

location /sajam/api/ {
    proxy_pass http://127.0.0.1:8020/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16m;   # fotografija s mobitela
    proxy_read_timeout 180s;    # čitanje lista s puno računa traje
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location /sajam/ {
    alias /var/www/sajam/;
    index index.html;
    # Bez keširanja: nova verzija mora stići na mobitel odmah, service worker radi offline ljusku.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

location = /sajam {
    return 301 /sajam/;
}
